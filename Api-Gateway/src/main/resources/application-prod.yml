server:
  port: ${PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/api/v1/auth/**
          filters:
            - name: JwtAuthenticationFilter

        - id: auth-oauth2
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/oauth2/**

        - id: auth-login
          uri: ${AUTH_SERVICE_URL}
          predicates:
            - Path=/login/**

        - id: profile-service
          uri: ${PROFILE_SERVICE_URL}
          predicates:
            - Path=/api/v1/profiles/**
          filters:
            - name: JwtAuthenticationFilter

        - id: profile-service-uploads
          uri: ${PROFILE_SERVICE_URL}
          predicates:
            - Path=/uploads/resumes/**

        - id: job-service
          uri: ${JOB_SERVICE_URL}
          predicates:
            - Path=/api/v1/jobs/**
          filters:
            - name: JwtAuthenticationFilter

        - id: application-service
          uri: ${APPLICATION_SERVICE_URL}
          predicates:
            - Path=/api/v1/applications/**
          filters:
            - name: JwtAuthenticationFilter

        - id: interview-service
          uri: ${INTERVIEW_SERVICE_URL}
          predicates:
            - Path=/api/v1/interviews/**
          filters:
            - name: JwtAuthenticationFilter

        - id: notification-service
          uri: ${NOTIFICATION_SERVICE_URL}
          predicates:
            - Path=/api/v1/notifications/**
          filters:
            - name: JwtAuthenticationFilter

        - id: subscription-service
          uri: ${SUBSCRIPTION_SERVICE_URL}
          predicates:
            - Path=/api/v1/subscriptions/**
          filters:
            - name: JwtAuthenticationFilter

        - id: analytics-service
          uri: ${ANALYTICS_SERVICE_URL}
          predicates:
            - Path=/api/v1/analytics/**
          filters:
            - name: JwtAuthenticationFilter

eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

app:
  jwt:
    secret: ${JWT_SECRET}
  public-paths:
    - /api/v1/auth/register
    - /api/v1/auth/login
    - /api/v1/auth/forgot-password
    - /api/v1/auth/reset-password
    - /api/v1/auth/refresh
    - /api/v1/jobs
    - /api/v1/jobs/**
    - /actuator/**
    - /oauth2/**
    - /login/**

logging:
  level:
    root: WARN

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
